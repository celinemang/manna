o\":\"개역한글\"},\"tags\":[\"anxiety\",\"peace\",\"prayer\"]},{\"id\":\"anxious-002\",\"emotion\":\"anxious\",\"reference\":{\"en\":\"Matthew 6:34\",\"ko\":\"마태복음 6:34\"},\"text\":{\"en\":\"Therefore don't be anxious for tomorrow, for tomorrow will be anxious for itself. Each day's own evil is sufficient.\",\"ko\":\"그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요 한 날 괴로움은 그 날에 족하니라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"anxiety\",\"today\"]},{\"id\":\"anxious-003\",\"emotion\":\"anxious\",\"reference\":{\"en\":\"1 Peter 5:7\",\"ko\":\"베드로전서 5:7\"},\"text\":{\"en\":\"Casting all your worries on him, because he cares for you.\",\"ko\":\"너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"anxiety\",\"care\"]},{\"id\":\"lonely-001\",\"emotion\":\"lonely\",\"reference\":{\"en\":\"Deuteronomy 31:6\",\"ko\":\"신명기 31:6\"},\"text\":{\"en\":\"Be strong and courageous. Don't be afraid or scared of them; for Yahweh your God himself is who goes with you. He will not fail you nor forsake you.\",\"ko\":\"너는 마음을 강하게 하고 담대히 하라 그들을 두려워 말라 그들 앞에서 떨지 말라 이는 네 하나님 여호와 그가 너와 함께 행하실 것임이라 결코 너를 떠나지 아니하시며 버리지 아니하시리라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"loneliness\",\"presence\"]},{\"id\":\"lonely-002\",\"emotion\":\"lonely\",\"reference\":{\"en\":\"Psalm 34:18\",\"ko\":\"시편 34:18\"},\"text\":{\"en\":\"Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.\",\"ko\":\"여호와는 마음이 상한 자에게 가까이 하시고 중심에 통회하는 자를 구원하시는도다\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"loneliness\",\"comfort\"]},{\"id\":\"lonely-003\",\"emotion\":\"lonely\",\"reference\":{\"en\":\"Matthew 28:20\",\"ko\":\"마태복음 28:20\"},\"text\":{\"en\":\"Behold, I am with you always, even to the end of the age.\",\"ko\":\"볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"loneliness\",\"presence\"]},{\"id\":\"tired-001\",\"emotion\":\"tired\",\"reference\":{\"en\":\"Matthew 11:28–29\",\"ko\":\"마태복음 11:28–29\"},\"text\":{\"en\":\"Come to me, all you who labor and are heavily burdened, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and lowly in heart; and you will find rest for your souls.\",\"ko\":\"수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라 나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그러면 너희 마음이 쉼을 얻으리니\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"rest\",\"weariness\"]},{\"id\":\"tired-002\",\"emotion\":\"tired\",\"reference\":{\"en\":\"Isaiah 40:31\",\"ko\":\"이사야 40:31\"},\"text\":{\"en\":\"But those who wait for Yahweh will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.\",\"ko\":\"오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"strength\",\"weariness\"]},{\"id\":\"tired-003\",\"emotion\":\"tired\",\"reference\":{\"en\":\"Psalm 23:1–3\",\"ko\":\"시편 23:1–3\"},\"text\":{\"en\":\"Yahweh is my shepherd; I shall lack nothing. He makes me lie down in green pastures. He leads me beside still waters. He restores my soul.\",\"ko\":\"여호와는 나의 목자시니 내게 부족함이 없으리로다 그가 나를 푸른 초장에 누이시며 쉴 만한 물 가으로 인도하시는도다 내 영혼을 소생시키시고\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"rest\",\"shepherd\"]},{\"id\":\"guilty-001\",\"emotion\":\"guilty\",\"reference\":{\"en\":\"1 John 1:9\",\"ko\":\"요한일서 1:9\"},\"text\":{\"en\":\"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.\",\"ko\":\"만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"forgiveness\",\"guilt\"]},{\"id\":\"guilty-002\",\"emotion\":\"guilty\",\"reference\":{\"en\":\"Romans 8:1\",\"ko\":\"로마서 8:1\"},\"text\":{\"en\":\"There is therefore now no condemnation to those who are in Christ Jesus, who don't walk according to the flesh, but according to the Spirit.\",\"ko\":\"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"grace\",\"guilt\"]},{\"id\":\"guilty-003\",\"emotion\":\"guilty\",\"reference\":{\"en\":\"Psalm 103:12\",\"ko\":\"시편 103:12\"},\"text\":{\"en\":\"As far as the east is from the west, so far has he removed our transgressions from us.\",\"ko\":\"동이 서에서 먼 것 같이 우리 죄과를 우리에게서 멀리 옮기셨으며\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"forgiveness\",\"mercy\"]},{\"id\":\"grateful-001\",\"emotion\":\"grateful\",\"reference\":{\"en\":\"1 Thessalonians 5:16–18\",\"ko\":\"데살로니가전서 5:16–18\"},\"text\":{\"en\":\"Always rejoice. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you.\",\"ko\":\"항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"gratitude\",\"joy\"]},{\"id\":\"grateful-002\",\"emotion\":\"grateful\",\"reference\":{\"en\":\"Psalm 118:24\",\"ko\":\"시편 118:24\"},\"text\":{\"en\":\"This is the day that Yahweh has made. We will rejoice and be glad in it!\",\"ko\":\"이 날은 여호와의 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"gratitude\",\"today\"]},{\"id\":\"grateful-003\",\"emotion\":\"grateful\",\"reference\":{\"en\":\"James 1:17\",\"ko\":\"야고보서 1:17\"},\"text\":{\"en\":\"Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation, nor turning shadow.\",\"ko\":\"각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라\"},\"translation\":{\"en\":\"WEB\",\"ko\":\"개역한글\"},\"tags\":[\"gratitude\",\"gift\"]},{\"id\":\"hopeful-001\",\"emotion\":\"hopeful\",\"reference\":{\"en\":\"Jeremiah 29:11\",\"ko\":\"예레미야 29:11\"},\"text\":{\"en\":\"For I know the thoughts that I think toward you, says Yahweh, thoughts of peace, and not of evil, to give you hope and a future.\"
